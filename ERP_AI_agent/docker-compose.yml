services:
  db:
    image: mysql:8.0
    container_name: erp_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: Admin0814
      MYSQL_DATABASE: erp_agent
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      retries: 5
    networks:
      - erp-network

  app:
    build:
      context: .
      target: production
    container_name: erp_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: Admin0814
      DB_NAME: erp_agent
      PORT: 3001
    ports:
      - "5173:5173"
      - "3001:3001"
    networks:
      - erp-network

volumes:
  db_data:

networks:
  erp-network:
    driver: bridge
